name: Optimize gallery images

on:
  push:
    branches: [main]
    paths:
      - "assets/gallery/**"
      - "content/gallery.json"

permissions:
  contents: write

concurrency:
  group: optimize-gallery
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Create lightweight images
        run: python scripts/optimize_gallery.py
      - name: Publish optimized gallery
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery content/gallery.json
          git commit -m "Optimize gallery images"
          git push
